<!DOCTYPE html>
<html>
<head>
<title>Login Event</title>
<style>
body{background:#0b0c1a;color:white;text-align:center;font-family:Arial}
.box{margin-top:100px}
input{padding:10px;margin:10px;border-radius:8px;border:none}
button{padding:10px 20px;border:none;border-radius:10px;background:#6c63ff;color:white}
</style>
</head>
<body>

<div class="box">
<h1>LOGIN PESERTA</h1>
<input id="username" placeholder="Masukkan Username"><br>
<button onclick="login()">Masuk</button>
</div>

<script>
function login(){
 let user=document.getElementById("username").value;
 if(user==""){alert("Isi username!");return;}

 localStorage.setItem("user",user);

 let adminConfirm=confirm("Apakah kamu admin?");
 if(adminConfirm){
   let pass=prompt("Masukkan Password Admin:");
   if(pass=="Admin#123"){
     window.location="admin.html";
   }else{
     alert("Password salah!");
   }
 }else{
   window.location="welcome.html";
 }
}
</script>

</body>
</html>
